name: mikrotik-saas-dev

services:
  # ──────────────────────────────────────────────
  # Infrastructure
  # ──────────────────────────────────────────────

  postgres:
    image: timescale/timescaledb:latest-pg17
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mikrotik_saas}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP

  # ──────────────────────────────────────────────
  # Application
  # ──────────────────────────────────────────────

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      target: dev
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages/db:/app/packages/db
      - ./packages/types:/app/packages/types
    env_file: .env.dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mikrotik_saas}
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      target: dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages/ui:/app/packages/ui
      - ./packages/types:/app/packages/types
    env_file: .env.dev
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: https://mkmgmt.computecloud.net
      NEXT_PUBLIC_WS_URL: wss://mkmgmt.computecloud.net
      BETTER_AUTH_URL: http://api:3001
    depends_on:
      - api

  trigger-worker:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      target: dev
    restart: unless-stopped
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages/db:/app/packages/db
      - ./packages/types:/app/packages/types
    env_file: .env.dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mikrotik_saas}
      REDIS_URL: redis://redis:6379
    command: ["bun", "run", "--hot", "apps/api/src/trigger.ts"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  agent:
    build:
      context: .
      dockerfile: docker/agent/Dockerfile
      target: dev
    restart: unless-stopped
    volumes:
      - ./packages/agent:/src
    env_file: .env.dev
    environment:
      AGENT_WS_URL: ws://api:3001/agent/ws
      AGENT_LOG_LEVEL: debug
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
